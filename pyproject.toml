[project]
name = "infusapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
infusapp = "infusapp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bcrypt>=5.0.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "pwinput>=1.0.3",
    "pynput>=1.8.2",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
]
